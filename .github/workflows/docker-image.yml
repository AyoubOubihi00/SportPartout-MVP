name: Build and Push Images

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v-*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker build+push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin-service
            image: monclub-admin-service
          - service: club-service
            image: monclub-club-service
          - service: findClub-service
            image: monclub-findclub-service
          - service: planning-service
            image: monclub-planning-service
	  - service: club-membership-service
	    image: monclub-club-membership-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            # Default branch gets 'latest'
            type=raw,value=latest,enable={{is_default_branch}}
            # On tags, keep the exact tag (works with tags like 'v-1.0')
            type=ref,event=tag
            # If tag is semver (e.g. 1.2.3), also publish v-<major>.<minor>
            type=semver,pattern={{major}}.{{minor}},prefix=v-
            # Branch builds (limited to main/dev by workflow trigger)
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release (on tag)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
