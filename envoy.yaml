static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: graphql_services
                      domains: ["*"]
                      routes:
                        # Route publique avec CORS activé
                        - match:
                            prefix: "/auth/public"
                          route:
                            prefix_rewrite: "/graphql"
                            cluster: authentification_service
                            cors:
                              allow_origin_string_match:
                                - prefix: "http://localhost:5173"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "Content-Type, Authorization"
                              expose_headers: "Authorization"
                              max_age: "86400"
                              allow_credentials: true

                        # Routes protégées
                        - match:
                            prefix: "/club/graphql"
                          route:
                            prefix_rewrite: "/graphql"
                            cluster: club_service
                            cors:
                              allow_origin_string_match:
                                - prefix: "http://localhost:5173"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "Content-Type, Authorization"
                              expose_headers: "Authorization"
                              max_age: "86400"
                              allow_credentials: true

                        - match:
                            prefix: "/admin/graphql"
                          route:
                            prefix_rewrite: "/graphql"
                            cluster: admin_service
                            cors:
                              allow_origin_string_match:
                                - prefix: "http://localhost:5173"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "Content-Type, Authorization"
                              expose_headers: "Authorization"
                              max_age: "86400"
                              allow_credentials: true

                        - match:
                            prefix: "/auth/graphql"
                          route:
                            prefix_rewrite: "/graphql"
                            cluster: authentification_service
                            cors:
                              allow_origin_string_match:
                                - prefix: "http://localhost:5173"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "Content-Type, Authorization"
                              expose_headers: "Authorization"
                              max_age: "86400"
                              allow_credentials: true

                        - match:
                            prefix: "/.well-known/jwks.json"
                          route:
                            cluster: jwt_provider_cluster
                            cors:
                              allow_origin_string_match:
                                - prefix: "http://localhost:5173"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "Content-Type, Authorization"
                              expose_headers: "Authorization"
                              max_age: "86400"
                              allow_credentials: true

                        - match:
                            prefix: "/findclub/graphql"
                          route:
                            prefix_rewrite: "/graphql"
                            cluster: findclub_service
                            cors:
                              allow_origin_string_match:
                                - prefix: "http://localhost:5173"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "Content-Type, Authorization"
                              expose_headers: "Authorization"
                              max_age: "86400"
                              allow_credentials: true

                        - match:
                            prefix: "/planning/graphql"
                          route:
                            prefix_rewrite: "/graphql"
                            cluster: planning_service
                            cors:
                              allow_origin_string_match:
                                - prefix: "http://localhost:5173"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "Content-Type, Authorization"
                              expose_headers: "Authorization"
                              max_age: "86400"
                              allow_credentials: true

                        - match:
                            prefix: "/bff/graphql"
                          route:
                            prefix_rewrite: "/graphql"
                            cluster: bff_service
                            cors:
                              allow_origin_string_match:
                                - prefix: "http://localhost:5173"
                              allow_methods: "GET, POST, OPTIONS"
                              allow_headers: "Content-Type, Authorization"
                              expose_headers: "Authorization"
                              max_age: "86400"
                              allow_credentials: true


                http_filters:
                  # ⚙️ Le filtre CORS doit être AVANT le routeur
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # 🔐 JWT filter
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        auth_provider:
                          issuer: "https://auth.sportpartout.fr"
                          #forward: true
                          remote_jwks:
                            http_uri:
                              uri: "http://authentification-service:8080/.well-known/jwks.json"
                              cluster: jwt_provider_cluster
                              timeout: 5s
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          forward_payload_header: "X-JWT-Claims"
                      rules:
                        - match:
                            prefix: "/auth/graphql"
                          requires:
                            provider_name: auth_provider

                        - match:
                            prefix: "/club/graphql"
                          requires:
                            provider_name: auth_provider

                        - match:
                            prefix: "/planning/graphql"
                          requires:
                            provider_name: auth_provider

                        - match:
                            prefix: "/bff/graphql"
                          requires:
                            provider_name: auth_provider

                  # 📦 Buffer filter
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 5242880

                  # 🚀 Router filter (toujours en dernier)
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router


  clusters:
    # Microservice "club"
    - name: club_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: club_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: club-service
                      port_value: 8080
    
    # Microservice d'administration
    - name: admin_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: admin_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: admin-service
                      port_value: 8080

    # Microservice d'authentification
    - name: authentification_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: authentification_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authentification-service
                      port_value: 8080

    # Microservice findClub
    - name: findclub_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: findclub_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: findclub-service
                      port_value: 8080
    # Microservice planning
    - name: planning_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: planning_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: planning-service
                      port_value: 8080

    # Microservice planning
    - name: bff_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: bff_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: bff-service
                      port_value: 8080


    # Cluster JWKS pour JWT validation (même service que authentification-service)
    - name: jwt_provider_cluster
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: jwt_provider_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authentification-service
                      port_value: 8080
