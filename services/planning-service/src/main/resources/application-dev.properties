spring.application.name=planning-service
server.port=8081

spring.datasource.url=jdbc:h2:mem:devbd;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.graphql.cors.allowed-origins=http://localhost:5173
spring.graphql.cors.allowed-methods=POST,OPTIONS
spring.graphql.cors.allowed-headers=*
spring.graphql.cors.allow-credentials=true

