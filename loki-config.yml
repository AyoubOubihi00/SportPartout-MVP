auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/boltdb-shipper-compactor
  
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules_ruler
  alertmanager_url: http://localhost:9093

# 👇 NOUVELLE SECTION À AJOUTER POUR RÉGLER L'ERREUR CONFIGURATION 👇
limits_config:
  # Permet d'utiliser les schémas plus anciens (v11) avec boltdb-shipper
  allow_structured_metadata: false