services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - monclub-net

  db-club:
    image: postgres:16
    container_name: monclub-db-club
    env_file:
      - ./services/club-service/.env
    ports:
      - "5433:5432"
    networks:
      - monclub-net
    volumes:
      - db_club_data:/var/lib/postgresql/data


  club-service:
    build: ./services/club-service
    container_name: monclub-club-service
    env_file:
      - ./services/club-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-club:5432/club_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        
    depends_on:
      - rabbitmq
      - db-club
    ports:
      - "8081:8080"
    networks:
      - monclub-net


  db-admin:
    image: postgres:16
    container_name: monclub-db-admin
    env_file:
      - ./services/admin-service/.env
    ports:
      - "5434:5432"
    networks:
      - monclub-net
    volumes:
      - db_admin_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $POSTGRES_USER -d admin_db || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20


  admin-service:
    build: ./services/admin-service
    container_name: monclub-admin-service
    env_file:
      - ./services/admin-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-admin:5432/admin_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
        
    depends_on:
      - rabbitmq
      - db-admin
    ports:
      - "8082:8080"
    networks:
      - monclub-net
  
  db-findclub:
    image: postgis/postgis:16-3.4-alpine
    container_name: monclub-db-findclub
    env_file:
      - ./services/findclub-service/.env
    ports:
      - "5435:5432"
    networks:
      - monclub-net
    volumes:
      - db_findclub_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $POSTGRES_USER -d findclub_db || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
    
  findclub-service:
    build: ./services/findclub-service
    container_name: monclub-findclub-service
    env_file:
      - ./services/findclub-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-findclub:5432/findclub_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

    depends_on:
      db-findclub:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "8083:8080"
    networks:
      - monclub-net

  db-planning:
    image: postgis/postgis:16-3.4-alpine
    container_name: monclub-db-planning
    env_file:
      - ./services/planning-service/.env
    ports:
      - "5437:5432"
    networks:
      - monclub-net
    volumes:
      - db_planning_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $POSTGRES_USER -d planning_db || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  planning-service:
    build: ./services/planning-service
    container_name: monclub-planning-service
    env_file:
      - ./services/planning-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-planning:5432/planning_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

    depends_on:
      db-planning:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "8085:8080"
    networks:
      - monclub-net

  db-authentification:
    image: postgis/postgis:16-3.4-alpine
    container_name: monclub-db-authentification
    env_file:
      - ./services/auth-service/.env
    ports:
      - "5436:5432"
    networks:
      - monclub-net
    volumes:
      - db_authentification_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $POSTGRES_USER -d authentification_db || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  authentification-service:
    build: ./services/auth-service
    container_name: monclub-authentification-service
    env_file:
      - ./services/auth-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-authentification:5432/authentification_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

    depends_on:
      db-findclub:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "8084:8080"
    networks:
      - monclub-net
  envoy-gateway:
    image: envoyproxy/envoy:v1.14.1
    container_name: envoy-gateway
    ports:
      - "8080:8080"  
      - "19000:19000" 
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - club-service
      - authentification-service
    networks:
      - monclub-net
  
  club-membership-service:
    build: ./services/club-membership-service
    container_name: monclub-club-membership-service
    env_file:
      - ./services/club-membership-service/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-membership:5432/membership_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

    depends_on:
      db-membership:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "8086:8080"
    networks:
      - monclub-net

  bff-service:
    build: ./services/bff-service
    container_name: monclub-bff-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CLUB_MEMBERSHIP_SERVICE_GRAPHQL_URL=http://club-membership-service:8080/graphql
      - CLUB_SERVICE_GRAPHQL_URL=http://club-service:8080/graphql
      - PLANNING_SERVICE_GRAPHQL_URL=http://planning-service:8080/graphql

    depends_on:
      club-service:
        condition: service_started
      planning-service:
        condition: service_started
    ports:
      - "8090:8080"
    networks:
      - monclub-net

  db-membership:
    image: postgis/postgis:16-3.4-alpine
    container_name: monclub-db-membership
    env_file:
      - ./services/club-membership-service/.env
    ports:
      - "5438:5432"
    networks:
      - monclub-net
    volumes:
      - db_membership_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL","pg_isready -U $POSTGRES_USER -d membership_db || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20

  pwa-app:
    image: node:18-slim
    container_name: monclub-pwa-app
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
      - pwa_node_modules:/usr/src/app/node_modules  # ✅ fixe le problème
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    networks:
      - monclub-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    user: "0" 
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml
      - loki_data:/loki
    networks:
      - monclub-net


  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monclub-net
    # Promtail doit être démarré après Loki, et avoir accès au socket Docker pour lire les logs
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - monclub-net
    depends_on:
      - loki



networks:
  monclub-net:
    driver: bridge

volumes:
  db_club_data:
  db_admin_data:
  db_findclub_data:
  db_planning_data:
  db_authentification_data:
  db_membership_data:
  pwa_node_modules:
  loki_data:
  grafana_data:

